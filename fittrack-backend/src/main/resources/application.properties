# Configuration du serveur
server.port=8080

# Configuration MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/fittrack_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root

# Configuration JPA / Hibernate
# 'update' permet a Hibernate de créer les tables manquantes et de mettre a jour le schema automatiquement
spring.jpa.hibernate.ddl-auto=update

# Affichage des requêtes SQL générées par Hibernate dans la console (pratique pour le dev)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Exécution de data.sql si vous en avez un (optionnel)
# Permet de charger des données de test APRES qu'Hibernate a créé les tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always